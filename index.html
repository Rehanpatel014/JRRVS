  <body class="bg-[#0b0b0b] text-[#f4f3ef] antialiased selection:bg-[#f4f3ef] selection:text-[#0b0b0b]" style="background-color: #0b0b0b; color: #f4f3ef; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0b0b; color: #f4f3ef; font-family: 'Space Grotesk', -apple-system, sans-serif; text-align: center; padding: 24px;">
        <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 8px;">JRRVS APPAREL</h1>
        <p style="font-size: 13px; color: #71717a; text-transform: uppercase; letter-spacing: 0.12em;">Streetwear Catalog Loading...</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', function() {
        var loader = document.getElementById('boot-loader');
        if (loader && !window.__APP_MOUNTED__) {
          loader.innerHTML =
            '<div style="max-width: 480px; background: #121316; border: 1px solid #3f3f46; border-radius: 12px; padding: 24px; text-align: left; font-family: monospace;">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">' +
            '<span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:50%;"></span>' +
            '<h2 style="font-size:16px;font-weight:700;color:#fff;margin:0;">GitHub Pages Deployment Setup</h2>' +
            '</div>' +
            '<p style="font-size:13px;color:#a1a1aa;line-height:1.6;margin-bottom:16px;">Vite React apps require building into static assets. In your GitHub repository:<br><br>1. Go to <b>Settings &rarr; Pages</b><br>2. Under <b>&ldquo;Source&rdquo;</b>, select <b>&ldquo;GitHub Actions&rdquo;</b><br>3. GitHub will automatically run the build workflow and publish your store!</p>' +
            '<button onclick="location.reload()" style="background:#fff;color:#000;border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">Reload</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
